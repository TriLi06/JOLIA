<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JOLIA Docs{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Inline-SVG-Icon-Sprite (Feather-Stil, monochrom) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="i-archive" viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></symbol>
        <symbol id="i-timeline" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
        <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
        <symbol id="i-scan" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
        <symbol id="i-jobs" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></symbol>
        <symbol id="i-review" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    </svg>

    <header class="app-nav">
        <div class="app-nav-inner">
            <a href="/files" class="brand" aria-label="JOLIA Docs Startseite">
                <svg class="icon"><use href="#i-archive"/></svg>
                <span>JOLIA Docs</span>
            </a>

            <nav class="nav-primary" aria-label="Hauptnavigation">
                <a href="/files" data-nav="/files"><svg class="icon"><use href="#i-timeline"/></svg><span>Timeline</span></a>
                <a href="/search" data-nav="/search"><svg class="icon"><use href="#i-search"/></svg><span>Suche</span></a>
                <a href="/chat" data-nav="/chat"><svg class="icon"><use href="#i-chat"/></svg><span>Chat</span></a>
            </nav>

            <div class="nav-right">
                <a href="/scan" class="nav-scan" data-nav="/scan"><svg class="icon"><use href="#i-scan"/></svg><span>Scan</span></a>
                <nav class="nav-secondary" aria-label="Weitere Bereiche">
                    <a href="/jobs" data-nav="/jobs" title="Jobs" aria-label="Jobs"><svg class="icon"><use href="#i-jobs"/></svg></a>
                    <a href="/review" data-nav="/review" title="Review" aria-label="Review"><svg class="icon"><use href="#i-review"/></svg></a>
                    <a href="/settings" data-nav="/settings" title="Einstellungen" aria-label="Einstellungen"><svg class="icon"><use href="#i-settings"/></svg></a>
                </nav>
            </div>
        </div>
    </header>

    <a id="model-mismatch-banner" class="app-banner" href="/settings#wartung" style="display:none"></a>

    <main class="container">
        <div id="flash-message" class="flash-message" style="display:none"></div>
        {% block content %}{% endblock %}
    </main>

    <footer class="container-fluid">
        <small>JOLIA Docs – Turn Documents, Photos and Scans into Knowledge.</small>
    </footer>

    <!-- Global wiederverwendbare Detail-Sidebar (Dateien, Suche, …) -->
    <div id="file-sidebar" class="file-sidebar">
        <div id="file-sidebar-resize-handle" class="file-sidebar-resize-handle"></div>
        <button class="outline secondary" onclick="closeDetail()" style="float:right">✕ Schließen</button>
        <div id="file-sidebar-content"></div>
    </div>
    <div id="file-sidebar-overlay" class="file-sidebar-overlay" onclick="closeDetail()" style="display:none"></div>

    <script>
        // Aktiven Navigationspunkt anhand des Pfad-Präfixes markieren.
        (function () {
            var path = window.location.pathname;
            document.querySelectorAll('[data-nav]').forEach(function (a) {
                var target = a.getAttribute('data-nav');
                if (path === target || (target !== '/' && path.indexOf(target) === 0)) {
                    a.classList.add('is-active');
                }
            });
        })();
        // Globaler Hinweis, wenn das indizierte Embedding-Modell nicht zur Konfiguration passt.
        fetch('/api/reindex/status').then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
            if (d && d.model_mismatch && d.warning) {
                var b = document.getElementById('model-mismatch-banner');
                b.textContent = '⚠ ' + d.warning + ' → Jetzt reindizieren';
                b.style.display = '';
            }
        }).catch(function () {});
    </script>
    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
