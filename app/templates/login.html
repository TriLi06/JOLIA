<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden – {{ app_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { max-width: 400px; width: 100%; }
    </style>
</head>
<body>
    <main class="container">
        <article class="login-card">
            <header>
                <h2>🗄 {{ app_name }}</h2>
                <p>Bitte melde dich an, um fortzufahren.</p>
            </header>
            {% if error %}
            <p style="color:var(--pico-color-red-500)">⚠️ {{ error }}</p>
            {% endif %}
            <form method="post" action="/auth/login">
                <input type="hidden" name="next_url" value="{{ request.query_params.get('next', '/dashboard') }}">
                <label for="username">Benutzername</label>
                <input type="text" id="username" name="username" required autofocus
                       placeholder="admin">
                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••">
                <button type="submit" style="width:100%">Anmelden</button>
            </form>
        </article>
    </main>
</body>
</html>
