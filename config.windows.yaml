app:
  host: "127.0.0.1"
  port: 8080
  debug: true
  app_name: "JOLIA Docs"

paths:
  inbox: "C:/dev/jolia/inbox"
  archive_root: "C:/dev/jolia/source_documents"
  data_dir: "C:/dev/jolia/data"
  temp_dir: "C:/dev/jolia/data/temp"
  backup_target: "C:/dev/jolia/backup"

models:
  embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  ollama_base_url: "http://localhost:11434"
  ollama_model: "qwen2.5:3b"
  whisper_cpp_binary: ""
  whisper_model_path: ""
  ffmpeg_binary: "ffmpeg"

processing:
  chunk_size: 1000
  chunk_overlap: 150
  max_file_size_mb: 2000
  enable_ocr: true
  enable_audio_transcription: false
  enable_video_transcription: false
  enable_image_ocr: true
  ocr_languages: "deu+eng"
  ocr_confidence_threshold: 60
  video_thumbnail_offset_pct: 10
  duplicate_hash_threshold: 8
  duplicate_time_window_seconds: 120

watcher:
  enabled: false
  scan_interval_seconds: 60
  stability_threshold_seconds: 30

scheduled_jobs:
  clustering: { enabled: true, interval_seconds: 3600 }
  backup: { enabled: true, interval_seconds: 86400 }
